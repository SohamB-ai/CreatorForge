services:
  - type: web
    name: creatorforge-api
    runtime: node
    buildCommand: npm ci --omit=dev --workspace @creatorforge/server
    startCommand: npm run start --workspace @creatorforge/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: AI_GENERATION_ENABLED
        value: "false"
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_GOOGLE_SIGN_IN_ENABLED
        value: "false"
