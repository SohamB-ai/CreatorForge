<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="50%" stop-color="#0E0E13" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E1E" />
      <stop offset="40%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <radialGradient id="penCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E1E" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="nibGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tileBg)" stroke="url(#rimGrad)" stroke-width="3.5" />
  <!-- Inner Rim Inset -->
  <rect x="36" y="36" width="440" height="440" rx="92" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#penCoreGlow)" />

  <!-- Geometric Construction Ring -->
  <circle cx="256" cy="256" r="148" stroke="#FFAA00" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- The Fountain Pen Nib -->
  <g transform="translate(0, 8)">
    <!-- Barrel / Grip section -->
    <path d="M228 340 L284 340 L290 395 C290 405, 275 414, 256 414 C237 414, 222 405, 222 395 Z" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
    <rect x="224" y="328" width="64" height="12" rx="3" fill="url(#nibGold)" stroke="#FEF08A" stroke-width="1" />

    <!-- Grip -->
    <path d="M230 270 L282 270 L286 328 L226 328 Z" fill="#09090B" stroke="#27272A" stroke-width="1.5" />
    <rect x="232" y="260" width="48" height="10" rx="2" fill="url(#nibGold)" stroke="#FEF08A" stroke-width="1" />

    <!-- Main Nib Wings -->
    <path d="M256 90 L234 165 C216 215, 233 245, 233 260 L279 260 C279 245, 296 215, 278 165 Z" fill="url(#nibGold)" stroke="#FDE047" stroke-width="2" stroke-linejoin="round" />

    <!-- Left Wing Shadow -->
    <path d="M256 90 L234 165 C216 215, 233 245, 233 260 L256 260 Z" fill="#B45309" fill-opacity="0.3" />

    <!-- Inner Scrollwork Inlay -->
    <path d="M256 130 L245 175 C235 205, 243 230, 243 248 L269 248 C269 230, 277 205, 267 175 Z" fill="#0F0F14" stroke="url(#nibGold)" stroke-width="1.5" />

    <!-- Breather Hole -->
    <circle cx="256" cy="195" r="11" fill="#09090B" stroke="url(#nibGold)" stroke-width="2" />
    <circle cx="256" cy="195" r="5" fill="#FF5E1E" filter="url(#tileGlow)" />
    <circle cx="256" cy="195" r="2.5" fill="#FFFFFF" />

    <!-- Capillary Ink Slit -->
    <line x1="256" y1="90" x2="256" y2="184" stroke="#09090B" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="90" x2="256" y2="184" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" filter="url(#tileGlow)" />

    <!-- Glowing Tipping Point -->
    <circle cx="256" cy="88" r="3.5" fill="#FFFFFF" filter="url(#tileGlow)" />
    <circle cx="256" cy="74" r="2" fill="#FF5E1E" filter="url(#tileGlow)" />
  </g>
</svg>
