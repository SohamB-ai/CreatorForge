<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="50%" stop-color="#0E0E13" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E1E" />
      <stop offset="50%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <radialGradient id="centerBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E1E" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="goldHilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Squircle App Tile / Medallion -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shieldBg)" stroke="url(#borderGrad)" stroke-width="3" />
  <!-- Inner Subtle Inset Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Ambient Center Flare -->
  <circle cx="256" cy="256" r="180" fill="url(#centerBurst)" />

  <!-- Geometric Construction Ring -->
  <circle cx="256" cy="256" r="148" stroke="#FFAA00" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- EMBLEM: Crossed Sword & Pen -->
  <!-- 1. Sword (Rotated 45 deg) -->
  <g transform="rotate(45 256 256)">
    <!-- Blade -->
    <path d="M256 80 L268 116 L267 312 L256 316 L245 312 L244 116 Z" fill="url(#steelBlade)" />
    <!-- Fuller Line -->
    <line x1="256" y1="108" x2="256" y2="295" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
    <!-- Crossguard -->
    <path d="M216 316 C216 312, 230 314, 244 316 L268 316 C282 314, 296 312, 296 316 C296 324, 284 328, 270 326 L242 326 C228 328, 216 324, 216 316 Z" fill="url(#goldHilt)" />
    <circle cx="256" cy="321" r="3.5" fill="#38BDF8" />
    <!-- Handle -->
    <rect x="251" y="326" width="10" height="64" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <line x1="251" y1="338" x2="261" y2="338" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="251" y1="352" x2="261" y2="352" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="251" y1="366" x2="261" y2="366" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="251" y1="380" x2="261" y2="380" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Pommel -->
    <polygon points="256,392 264,396 264,406 256,410 248,406 248,396" fill="url(#goldHilt)" />
  </g>

  <!-- 2. Pen (Rotated -45 deg) -->
  <g transform="rotate(-45 256 256)">
    <!-- Barrel -->
    <path d="M245 220 L267 220 L270 390 C270 398, 264 404, 256 404 C248 404, 242 398, 242 390 Z" fill="#2E1065" stroke="#7C3AED" stroke-width="1.5" />
    <!-- Gold Trim Bands -->
    <rect x="243" y="220" width="26" height="6" rx="1" fill="url(#goldHilt)" />
    <rect x="245" y="230" width="22" height="2" rx="0.5" fill="url(#goldHilt)" />
    <!-- Grip Section -->
    <path d="M245 175 L267 175 L269 220 L243 220 Z" fill="#0F172A" />
    <!-- Front Collar -->
    <rect x="246" y="171" width="20" height="4" rx="1" fill="url(#goldHilt)" />
    <!-- Fountain Nib -->
    <path d="M246 171 C246 150, 235 134, 246 104 L256 72 L266 104 C277 134, 266 150, 266 171 Z" fill="url(#goldHilt)" stroke="#FEF08A" stroke-width="1.5" />
    <!-- Slit & Breather Hole -->
    <line x1="256" y1="72" x2="256" y2="132" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <circle cx="256" cy="134" r="4" fill="#0F172A" stroke="#FEF08A" stroke-width="1" />
  </g>

  <!-- Center Core Fusion Star -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="6" fill="#FF5E1E" filter="url(#badgeGlow)" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <path d="M0 -16 L2 -5 L14 0 L2 5 L0 16 L-2 5 L-14 0 L-2 -5 Z" fill="#FFFFFF" />
  </g>
</svg>
