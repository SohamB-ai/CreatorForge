<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radiant Core Ambient Glow -->
    <radialGradient id="penAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF5E1E" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="85%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <!-- Luxury Gold Nib Gradient -->
    <linearGradient id="nibGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="nibGoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Barrel Obsidian & Indigo Gradient -->
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F0F14" />
      <stop offset="35%" stop-color="#1E1B4B" />
      <stop offset="65%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F0F14" />
    </linearGradient>

    <!-- Glowing Molten Capillary Ink Slit -->
    <linearGradient id="inkGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#FF5E1E" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="forgeFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="256" cy="256" r="230" fill="url(#penAura)" />

  <!-- Outer Geometric Blueprint & Alignment Guides -->
  <circle cx="256" cy="256" r="216" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="160" stroke="#FF5E1E" stroke-opacity="0.12" stroke-width="1.5" />
  <circle cx="256" cy="256" r="88" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Cardinal Precision Tick Marks -->
  <line x1="256" y1="20" x2="256" y2="36" stroke="#FFAA00" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  <line x1="256" y1="476" x2="256" y2="492" stroke="#FFAA00" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="256" x2="36" y2="256" stroke="#FFAA00" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  <line x1="476" y1="256" x2="492" y2="256" stroke="#FFAA00" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />

  <!-- ============================================== -->
  <!-- THE PEN MARK: ICONIC LUXURY FOUNTAIN PEN NIB -->
  <!-- ============================================== -->
  <g filter="url(#softShadow)">

    <!-- 1. Pen Barrel Base / Grip Section -->
    <path d="M216 350 L296 350 L304 430 C304 446, 282 458, 256 458 C230 458, 208 446, 208 430 Z" fill="url(#barrelGrad)" stroke="#4338CA" stroke-width="1.5" />
    <!-- Barrel Specular Line -->
    <line x1="252" y1="352" x2="252" y2="452" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round" />

    <!-- 2. Dual Accent Rings (Gold Collar Band) -->
    <rect x="212" y="338" width="88" height="12" rx="3" fill="url(#nibGoldLight)" stroke="#FEF08A" stroke-width="1" />
    <rect x="218" y="326" width="76" height="6" rx="2" fill="url(#nibGoldShadow)" />

    <!-- 3. Grip Section -->
    <path d="M222 260 L290 260 L296 326 L216 326 Z" fill="#09090B" stroke="#27272A" stroke-width="1.5" />

    <!-- 4. Front Mounting Ring -->
    <rect x="224" y="250" width="64" height="10" rx="2.5" fill="url(#nibGoldLight)" stroke="#FEF08A" stroke-width="1" />

    <!-- 5. The Fountain Pen Nib -->
    <!-- Left Wing (Shaded Gold) -->
    <path d="M256 52 L228 140 C206 200, 226 235, 226 250 L256 250 Z" fill="url(#nibGoldShadow)" stroke="#B45309" stroke-width="1" />
    <!-- Right Wing (Polished High-Key Gold) -->
    <path d="M256 52 L284 140 C306 200, 286 235, 286 250 L256 250 Z" fill="url(#nibGoldLight)" stroke="#FDE047" stroke-width="1" />

    <!-- Nib Outer Fillet Outline -->
    <path d="M256 52 L228 140 C206 200, 226 235, 226 250 L286 250 C286 235, 306 200, 284 140 Z" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 6. Inner Nib Inlay / Scrollwork (Obsidian & Indigo Tone) -->
    <path d="M256 100 L242 152 C230 190, 240 216, 240 234 L272 234 C272 216, 282 190, 270 152 Z" fill="#181820" fill-opacity="0.85" stroke="url(#nibGoldLight)" stroke-width="1.5" />

    <!-- 7. The Breather Hole (Centered Heart of the Nib) -->
    <circle cx="256" cy="180" r="14" fill="#09090B" stroke="url(#nibGoldLight)" stroke-width="2.5" />
    <circle cx="256" cy="180" r="7" fill="#FF5E1E" filter="url(#forgeFilter)" />
    <circle cx="256" cy="180" r="3" fill="#FFFFFF" />

    <!-- 8. Glowing Capillary Ink Slit -->
    <line x1="256" y1="52" x2="256" y2="166" stroke="#09090B" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="52" x2="256" y2="166" stroke="url(#inkGlow)" stroke-width="2" stroke-linecap="round" filter="url(#forgeFilter)" />

    <!-- Slit Extends Down to Feed -->
    <line x1="256" y1="194" x2="256" y2="245" stroke="url(#inkGlow)" stroke-width="1.5" stroke-linecap="round" />

    <!-- 9. Nib Tip Micro-Diamond (Iridium Tipping Point) -->
    <polygon points="256,46 261,54 256,60 251,54" fill="#FFFFFF" filter="url(#forgeFilter)" />
    <circle cx="256" cy="50" r="3" fill="#FFFFFF" />

    <!-- 10. Radiant Creative Spark Particles Emanating from Tip -->
    <g transform="translate(256, 44)">
      <circle cx="0" cy="-14" r="2.5" fill="#FF5E1E" filter="url(#forgeFilter)" />
      <circle cx="-16" cy="-8" r="2" fill="#FFAA00" />
      <circle cx="16" cy="-8" r="2" fill="#FFAA00" />
      <circle cx="-24" cy="-20" r="1.5" fill="#8B5CF6" />
      <circle cx="24" cy="-20" r="1.5" fill="#8B5CF6" />
      <circle cx="0" cy="-28" r="1.5" fill="#FDE047" />
    </g>
  </g>
</svg>
