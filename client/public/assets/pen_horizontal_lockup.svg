<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lockupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E1E" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>

    <radialGradient id="iconBgAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E1E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="lockupGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Container (Squircle) -->
  <rect x="24" y="24" width="112" height="112" rx="28" fill="#131318" stroke="#FF5E1E" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="80" cy="80" r="44" fill="url(#iconBgAura)" />

  <!-- Pen Nib Icon Inside Left Container -->
  <g transform="translate(80, 80) scale(0.38) translate(-256, -240)">
    <!-- Main Nib Wings -->
    <path d="M256 90 L234 165 C216 215, 233 245, 233 260 L279 260 C279 245, 296 215, 278 165 Z" fill="url(#lockupGold)" stroke="#FDE047" stroke-width="2" stroke-linejoin="round" />
    <path d="M256 90 L234 165 C216 215, 233 245, 233 260 L256 260 Z" fill="#B45309" fill-opacity="0.3" />

    <!-- Breather Hole -->
    <circle cx="256" cy="195" r="11" fill="#09090B" stroke="url(#lockupGold)" stroke-width="2" />
    <circle cx="256" cy="195" r="5" fill="#FF5E1E" filter="url(#lockupGlow)" />

    <!-- Capillary Ink Slit -->
    <line x1="256" y1="90" x2="256" y2="184" stroke="#09090B" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="90" x2="256" y2="184" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" filter="url(#lockupGlow)" />
    
    <!-- Spark -->
    <circle cx="256" cy="86" r="3.5" fill="#FFFFFF" filter="url(#lockupGlow)" />
  </g>

  <!-- Typography: CreatorForge -->
  <!-- "Creator" in Crisp White -->
  <text x="160" y="93" fill="#FFFFFF" font-family="'Geist', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.03em">Creator<tspan fill="url(#textGrad)">Forge</tspan></text>

  <!-- Subtitle Tagline -->
  <text x="162" y="118" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" letter-spacing="0.12em">MULTIMODAL AI WORKSPACE</text>
</svg>
